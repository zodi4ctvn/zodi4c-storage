name: Feature request
description: Suggest an improvement for zodi4c-storage
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind.
        Please check existing issues and the roadmap in README.md before submitting.

        Önce sorunu, sonra düşündüğünüz çözümü anlatın.
        Göndermeden önce mevcut issue'ları ve README.md dosyasını kontrol edin.
        Formu Türkçe veya İngilizce doldurabilirsiniz.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work from a player and admin perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you evaluated.

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - UI / NUI
        - Server logic
        - Database
        - Localization
        - Documentation
        - Performance
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
        - label: I can help with testing.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
